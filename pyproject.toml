[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medsched"
version = "0.2.0"
description = "Turn pharmacy label directions into a large-print daily schedule, and refuse to guess when a label is unclear"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kishore Nuthalapati" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["medication", "older adults", "caregiving", "abstention", "patient safety", "ocr"]

[project.urls]
Homepage = "https://github.com/kishoren18-hue/medsched"
Issues = "https://github.com/kishoren18-hue/medsched/issues"
Changelog = "https://github.com/kishoren18-hue/medsched/blob/main/CHANGELOG.md"

[project.optional-dependencies]
ocr = ["pytesseract>=0.3", "Pillow>=9"]
dev = ["pytest>=7", "pytesseract>=0.3", "Pillow>=9", "ruff>=0.6", "pytest-cov>=5", "pre-commit>=3"]

[project.scripts]
medsched = "medsched.cli:main"

[tool.setuptools.package-data]
medsched = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E731", "E501"]  # long lines are mostly HTML templates

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"scripts/*" = ["E402"]
"examples/*" = ["E402"]
"benchmarks/*" = ["E402"]
